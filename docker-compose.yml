  # my-device:
  #   <<: *sender
  #   depends_on: [mosquitto]
  #   volumes:
  #     - ./schemas:/config/custom:ro
  #   command: [vlmqttsender-cli, /config/custom/example_device.json, --broker=mosquitto]
